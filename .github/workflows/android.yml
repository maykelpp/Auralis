name: Auralis Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: dtolnay/rust-toolchain@stable
      - name: Generate Android project and install native SAF bridge
        run: |
          flutter create . --platforms=android --org app.auralis --project-name auralis_player
          mkdir -p android/app/src/main/kotlin/app/auralis/auralis_player
          cp native/android/MainActivity.kt android/app/src/main/kotlin/app/auralis/auralis_player/MainActivity.kt
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 23/' android/app/build.gradle.kts || true
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 23/' android/app/build.gradle || true
          python3 tool/prepare_android.py
      - run: cargo test --manifest-path rust_backend/Cargo.toml
      - run: flutter pub get
      - run: flutter analyze --no-pub
      - run: flutter test
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: Auralis-Android-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
